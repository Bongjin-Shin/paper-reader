[package]
name = "paper-vocabulary"
version = "0.1.2"
description = "Local-first paper reader — Phase 1"
edition = "2021"
rust-version = "1.88"

[lib]
name = "paper_vocabulary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "paper-vocabulary"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
reader-profile = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "dep:webkit2gtk", "dep:gtk", "dep:poppler-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tokio = { version = "1", features = ["macros", "sync"] }
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
lopdf = { version = "0.45", default-features = false }
dotenvy = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", optional = true }
gtk = { version = "0.18", optional = true }
poppler-rs = { version = "=0.22.0", features = ["v0_82"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
